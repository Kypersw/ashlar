name: Release

# Builds the server jar and publishes it as a GitHub release: push a tag like v26.2-1, or run it by hand.
on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:   # or press "Run workflow" in the Actions tab

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Git user for patching
        run: git config --global user.email "actions@github.com" && git config --global user.name "Github Actions"
      - name: Apply patches
        run: ./gradlew applyAllPatches --stacktrace
      - name: Build the server jar
        run: ./gradlew :fork-server:createPaperclipJar --stacktrace
      - name: Name the jar
        run: |
          MC=$(grep '^mcVersion=' gradle.properties | cut -d= -f2)
          mkdir -p out
          cp fork-server/build/libs/*-paperclip-*.jar "out/ashlar-$MC.jar"
          cd out && sha256sum "ashlar-$MC.jar" > "ashlar-$MC.jar.sha256"
          echo "MC=$MC" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then echo "TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"; else echo "TAG=v$MC-$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"; fi
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          name: Ashlar ${{ env.MC }} (${{ env.TAG }})
          body: |
            Ashlar for Minecraft ${{ env.MC }}. Needs Java 25. Players on Java 1.8 to 26.x can join.
            Download `ashlar-${{ env.MC }}.jar` below. More on https://craftrank.org/ashlar
          files: |
            out/ashlar-${{ env.MC }}.jar
            out/ashlar-${{ env.MC }}.jar.sha256
